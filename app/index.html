    if (gone.length) {
      view.append(h("h3", { class: "section-title", text: "已移除的成員" }));
      const c = h("div", { class: "card flat" });
      for (const m of gone) {
        c.append(h("div", { class: "prow" }, miniAv(m.id), h("span", { text: m.name }),
          state.readOnly ? null : h("button", { type: "button", class: "mini-btn", text: "加回來", disabled: act.length >= MAX_MEMBERS || null, onclick: () => archiveMember(m.id, false) })));
      }
      view.append(c);
    }

    if (state.localMode) {
      view.append(h("h3", { class: "section-title", text: "資料備份" }));
      view.append(h("div", { class: "card" },
        h("p", { class: "small", style: "margin:0 0 10px", text: "本機模式：帳本只存在這支手機的瀏覽器。換手機或清除瀏覽資料前，先匯出備份。" }),
        h("div", { class: "btn-row" },
          h("button", { type: "button", class: "secondary", text: "匯出備份", onclick: exportBackup }),
          h("button", { type: "button", class: "secondary", text: "匯入備份", onclick: () => $("#importInput").click() }))));
    }
    view.append(h("h3", { class: "section-title", text: "關於 EatTogether" }));
    view.append(h("div", { class: "card" }, h("div", { class: "pick" },
      h("a", { class: "secondary link-btn", href: "../index.html", text: "網站首頁" }),
      h("a", { class: "secondary link-btn", href: "../pages/guide.html", text: "使用教學" }),
      h("a", { class: "secondary link-btn", href: "../pages/algorithm.html", text: "抵銷怎麼算" }))));

    if (state.isOwner && !state.localMode) {
      view.append(h("h3", { class: "section-title", text: "分享給朋友" }));
      view.append(h("div", { class: "card" },
        h("ol", { class: "steps" },
          h("li", { text: "朋友需要有 claude.ai 帳號，打開時要登入。" }),
          h("li", null, "用右上角的分享，輸入朋友的 email，權限選「", h("b", { text: "編輯者" }), "」。"),
          h("li", null, h("b", { text: "不要開公開連結" }), "：開了之後，受邀的朋友就不能記帳了。"),
          h("li", { text: "在手機瀏覽器把網址加到主畫面，用起來像 App。" }))));
    }

    for (const id in drafts) { const el = document.getElementById(id); if (el) { el.value = drafts[id]; el.dataset.dirty = "1"; } }
    if (keep) {
      const el = document.getElementById(keep.id);
      if (el) { el.value = keep.value; el.focus(); try { el.setSelectionRange(keep.a, keep.b); } catch (e) {} }
    }
  }
  function setMe(id) {
    state.me = id;
    local.set(ME_KEY, id);
    state.skippedPicker = false;
    scheduleRender();
  }
  function nextColor() {
    const used = new Set(activeMembers().map((m) => (m.color | 0) % 8));
    for (let i = 0; i < 8; i++) if (!used.has(i)) return i;
    return state.members.length % 8;
  }
  async function saveTitle(raw) {
    const title = (raw || "").trim().slice(0, 16);
    if (title === (state.title || "").trim()) { toast("名稱沒有變"); return; }
    const ok = await write(() => state.db.doc("meta/settings").set({ title, updatedAt: Date.now() }));
    if (ok) {
      const el = $("#titleInput"); if (el) delete el.dataset.dirty;
      toast(title ? `帳本名稱改成「${title}」` : `帳本名稱改回「${DEFAULT_TITLE}」`);
    }
  }
  async function addMember(raw) {
    const name = (raw || "").trim().slice(0, 12);
    if (!name) { toast("先輸入名字"); return; }
    if (activeMembers().length >= MAX_MEMBERS) return;
    if (activeMembers().some((m) => m.name === name)) { toast("已經有叫「" + name + "」的人了"); return; }
    const order = Math.max(-1, ...state.members.map((m) => m.order | 0)) + 1;
    const ok = await write(() => state.db.collection("members").doc().set({ name, color: nextColor(), order, archived: false, createdAt: Date.now() }));
    if (ok) { toast("已加入 " + name); const el = $("#newMemberName"); if (el) { el.value = ""; delete el.dataset.dirty; } }
  }
  async function renameMember(id, raw) {
    const name = (raw || "").trim().slice(0, 12);
    const m = memberById(id);
    if (!m || !name || name === m.name) { scheduleRender(); return; }
    await write(() => state.db.doc("members/" + id).update({ name }));
  }
  async function archiveMember(id, archived) {
    const m = memberById(id);
    if (!m) return;
    if (archived && derived.edges.some((e) => e.from === id || e.to === id)) { toast("還有未結清的帳，不能移除"); return; }
    const patch = archived ? { archived: true } : { archived: false, order: Math.max(-1, ...state.members.map((x) => x.order | 0)) + 1 };
    const ok = await write(() => state.db.doc("members/" + id).update(patch));
    if (ok) toast(archived ? `已移除 ${m.name}` : `${m.name} 加回來了`, archived ? "復原" : null, archived ? () => archiveMember(id, false) : null);
  }

  // ---------- 頭貼 ----------
  let photoFor = null;
  function pickPhoto(id) {
    if (!state.assets || state.readOnly) return;
    photoFor = id;
    const input = $("#photoInput");
    input.value = "";
    input.click();
  }
  $("#photoInput").addEventListener("change", (ev) => {
    const file = ev.target.files && ev.target.files[0];
    const id = photoFor;
    photoFor = null;
    if (file && id) processPhoto(file, id);
  });
  function squareJpeg(file, size) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const s = Math.min(img.naturalWidth, img.naturalHeight);
          if (!s) throw { code: "decode" };
          const c = document.createElement("canvas");
          c.width = c.height = size;
          const ctx = c.getContext("2d");
          ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
          c.toBlob((b) => { URL.revokeObjectURL(url); b ? resolve(b) : reject({ code: "decode" }); }, "image/jpeg", 0.85);
        } catch (e) { URL.revokeObjectURL(url); reject(e && e.code ? e : { code: "decode" }); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject({ code: "decode" }); };
      img.src = url;
    });
  }
  function photoError(e) {
    switch (e && e.code) {
      case "decode": return "這張圖片讀不到，換一張試試。";
      case "too_large": return "圖片太大了，換一張小一點的。";
      case "unsupported_type": return "不支援這種圖片格式，換一張試試。";
      case "rate_limited": return "上傳太頻繁了，等一下再試。";
      case "quota_or_state": return "頭貼空間滿了，先移除一些舊頭貼。";
      case "upstream_auth": return "登入狀態過期了，重新整理頁面再試一次。";
      case "not_granted": case "capability_disabled": case "capability_removed": return "你目前不能上傳頭貼，需要編輯者權限。";
      default: return "頭貼沒有上傳成功，請確認網路後再試一次。";
    }
  }
  async function processPhoto(file, id) {
    if (file.type && !/^image\//.test(file.type)) { toast("請選一張圖片。"); return; }
    state.uploading.add(id);
    scheduleRender();
    try {
      const blob = await squareJpeg(file, 256);
      let res;
      try { res = await state.assets.upload(blob, { type: "image/jpeg" }); }
      catch (e) {
        if (e && e.code === "store_unavailable") { await sleep(800); res = await state.assets.upload(blob, { type: "image/jpeg" }); }
        else throw e;
      }
      const old = photoId(memberById(id)) || (memberById(id) || {}).photo;
      const ok = await write(() => state.db.doc("members/" + id).update({ photo: res.id }));
      if (ok) {
        toast("頭貼更新了");
        if (old && old !== res.id) state.assets.delete(old).catch(() => {});
      } else state.assets.delete(res.id).catch(() => {});
    } catch (e) {
      toast(photoError(e));
    } finally {
      state.uploading.delete(id);
      scheduleRender();
    }
  }
  async function removePhoto(id) {
    const m = memberById(id);
    const old = m && m.photo;
    if (!old) return;
    const ok = await write(() => state.db.doc("members/" + id).update({ photo: null }));
    if (ok) {
      toast("已移除頭貼");
      if (state.assets) state.assets.delete(old).catch(() => {});
    }
  }

  // ---------- 本機模式備份 ----------
  function exportBackup() {
    const json = JSON.stringify(window.EatStore.local.exportAll(), null, 2);
    const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    const a = h("a", { href: url, download: `eattogether-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("已匯出備份檔");
  }
  $("#importInput").addEventListener("change", (ev) => {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        window.EatStore.local.importAll(JSON.parse(r.result));
        state.skippedPicker = false;
        toast("已匯入備份");
      } catch (e) { toast("這不是 EatTogether 的備份檔。"); }
    };
    r.readAsText(file);
  });

  // ---------- onboarding & picker ----------
  let obBusy = false;
  function obField(value) {
    const wrap = h("div", { class: "ob-item" });
    const n = $("#obList").children.length + 1;
    const input = h("input", { class: "field", id: "ob-" + n, maxlength: "12", placeholder: `第 ${n} 位的名字`, "aria-label": `第 ${n} 位的名字`, value: value || "" });
    wrap.append(h("span", { class: "mini-av", style: `--c:var(--m${(n - 1) % 8})`, text: String(n) }), input);
    return wrap;
  }
  function ensureObFields() {
    const list = $("#obList");
    if (!list.children.length) for (let i = 0; i < 3; i++) list.append(obField());
  }
  $("#obAdd").addEventListener("click", () => {
    const list = $("#obList");
    if (list.children.length >= MAX_MEMBERS) return;
    const f = obField();
    list.append(f);
    f.querySelector("input").focus();
    $("#obAdd").disabled = list.children.length >= MAX_MEMBERS;
  });
  $("#obForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (obBusy) return;
    const names = [];
    for (const inp of $("#obList").querySelectorAll("input")) {
      const v = inp.value.trim().slice(0, 12);
      if (v && !names.includes(v)) names.push(v);
    }
    const title = $("#obTitle").value.trim().slice(0, 16);
    const msg = $("#obMsg");
    if (names.length < 2) { msg.hidden = false; msg.textContent = "至少要兩個人才能記帳。"; return; }
    obBusy = true;
    $("#obGo").disabled = true;
    msg.hidden = false; msg.textContent = "建立中…";
    try {
      const lock = await state.db.doc("meta/setup").acquire({ holder: "setup-" + Math.random().toString(36).slice(2), ttlMs: 15000 });
      if (!lock.acquired) { msg.textContent = "有人正在建立成員，稍等一下。"; return; }
      const existing = await state.db.collection("members").get();
      if (!existing.empty) { msg.textContent = "已經有人建立好成員了。"; return; }
      const now = Date.now();
      if (title) await state.db.doc("meta/settings").set({ title, updatedAt: now });
      for (let i = 0; i < names.length; i++) {
        await state.db.collection("members").doc().set({ name: names[i], color: i % 8, order: i, archived: false, createdAt: now + i });
      }
      await state.db.doc("meta/setup").set({ done: true, at: now });
      msg.hidden = true;
    } catch (e) {
      if (e && (e.code === "invalid_argument" || e.code === "not_granted")) { setReadOnly(); msg.textContent = READONLY_MSG; }
      else msg.textContent = "沒有建立成功，請確認網路後再試一次。";
    } finally {
      obBusy = false;
      $("#obGo").disabled = false;
    }
  });
  $("#meBtn").addEventListener("click", () => { state.skippedPicker = false; showPicker(true); });

  let pickerForced = false;
  function showPicker(force) { pickerForced = !!force; renderOverlays(); }
  function renderOverlays() {
    const act = activeMembers();
    const needOnboard = state.membersReady && state.confirmed && act.length === 0 && !state.members.length && !state.readOnly && !state.nodb;
    const ob = $("#onboard");
    if (needOnboard) ensureObFields();
    ob.hidden = !needOnboard;

    const meValid = act.some((m) => m.id === state.me);
    const needPick = !needOnboard && state.membersReady && act.length > 0 && (pickerForced || (!meValid && !state.skippedPicker));
    const pk = $("#picker");
    if (needPick) {
      const list = $("#pickList");
      list.replaceChildren(...act.map((m) => {
        const av = h("span", { class: "av" });
        fillAvatar(av, m);
        return h("button", {
          type: "button", "aria-pressed": String(m.id === state.me),
          onclick: () => { pickerForced = false; setMe(m.id); },
        }, av, h("span", { text: m.name }));
      }));
      $("#pickLater").textContent = meValid ? "不用改" : "先不選，只看帳";
      $("#pickLater").onclick = () => { pickerForced = false; state.skippedPicker = true; scheduleRender(); };
    }
    pk.hidden = !needPick;
  }

  // ---------- tabs ----------
  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
    state.tab = b.dataset.tab;
    document.querySelectorAll(".tabs button").forEach((x) => { if (x === b) x.setAttribute("aria-current", "page"); else x.removeAttribute("aria-current"); });
    $("#view-graph").hidden = state.tab !== "graph";
    $("#view-log").hidden = state.tab !== "log";
    $("#view-people").hidden = state.tab !== "people";
    state.selected = null;
    scheduleRender();
  }));

  // ---------- sync ----------
  let unsubs = [];
  let loadTimer = null;
  function subscribe() {
    const db = state.db;
    const flags = { members: null, entries: null };
    const pend = { members: false, entries: false };
    clearTimeout(loadTimer);
    loadTimer = setTimeout(() => { if (!state.confirmed) { state.stale = true; scheduleRender(); } }, 10000);
    const onMeta = (name, snap) => {
      flags[name] = snap.metadata.fromCache;
      pend[name] = snap.metadata.hasPendingWrites;
      if (!state.confirmed && flags.members === false && flags.entries === false) {
        state.confirmed = true; state.stale = false; clearTimeout(loadTimer);
      }
      state.fromCache = !!(flags.members || flags.entries);
      state.pending = pend.members || pend.entries;
    };
    const onErr = (e) => {
      clearTimeout(loadTimer);
      if (e && e.code === "revoked") { state.nodb = true; }
      else state.error = true;
      scheduleRender();
    };
    unsubs.push(db.collection("members").onSnapshot((snap) => {
      state.members = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()))
        .sort((a, b) => (a.order | 0) - (b.order | 0) || (a.createdAt || 0) - (b.createdAt || 0));
      state.membersReady = true;
      onMeta("members", snap);
      scheduleRender();
    }, onErr));
    unsubs.push(db.collection("entries").onSnapshot((snap) => {
      state.entries = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      state.entriesReady = true;
      onMeta("entries", snap);
      scheduleRender();
    }, onErr));
    try {
      unsubs.push(db.doc("meta/settings").onSnapshot((snap) => {
        const data = snap.exists ? snap.data() : null;
        state.title = data && typeof data.title === "string" ? data.title.slice(0, 16) : "";
        scheduleRender();
      }, () => {}));
    } catch (e) {}
  }
  function resubscribe() {
    unsubs.forEach((u) => { try { u(); } catch (e) {} });
    unsubs = [];
    state.error = false; state.confirmed = false; state.stale = false;
    scheduleRender();
    subscribe();
  }

  // 沒有 claude.ai 共享資料庫時（例如 GitHub Pages），改用存在這台裝置的本機模式
  function useLocal() {
    state.localMode = true;
    state.db = window.EatStore.local.db;
    state.assets = window.EatStore.local.assets;
    subscribe();
  }

  async function boot() {
    renderAll();
    const c = window.claude;
    if (!c || typeof c.use !== "function") { useLocal(); return; }
    const safe = (p) => Promise.resolve(p).catch(() => null);
    const [db, user, assets] = await Promise.all([safe(c.use("db")), safe(c.use("user")), safe(c.use("assets"))]);
    state.user = user;
    state.assets = assets || null;
    if (!db) { useLocal(); return; }
    state.db = db;
    if (user) {
      try { user.isOwner().then((v) => { state.isOwner = !!v; scheduleRender(); }, () => {}); } catch (e) {}
      try { if (typeof user.can === "function") user.can("data.write").then((v) => { if (v === false) setReadOnly(); }, () => {}); } catch (e) {}
    }
    subscribe();
  }

  if (window.ResizeObserver) new ResizeObserver(() => scheduleRender()).observe($("#stage"));
  else window.addEventListener("resize", scheduleRender);
  boot();
})();
</script>
</body>
</html>
